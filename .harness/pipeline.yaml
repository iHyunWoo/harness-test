pipeline:
  name: harness-test CI
  identifier: harness_test_ci
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}

  properties:
    ci:
      codebase:
        # Harness Code Repository 를 쓰면 connectorRef 가 필요 없다.
        # 외부 GitHub 을 쓰면 connectorRef: <커넥터 ID> 를 추가한다.
        repoName: collabops-web-harness
        build: <+input>

  stages:
    - stage:
        name: build
        identifier: build
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          # 워크스페이스(/harness) 밖 경로는 스텝 간에 유지되지 않는다.
          sharedPaths:
            - /root/.cache/pip

          execution:
            steps:
              - step:
                  type: Run
                  name: Install dependencies
                  identifier: install
                  spec:
                    shell: Sh
                    command: |-
                      python -m pip install --upgrade pip
                      pip install -r requirements-dev.txt

              - step:
                  type: Run
                  name: Lint
                  identifier: lint
                  spec:
                    shell: Sh
                    command: ruff check .

              # 정상 스위트. 실패하면 파이프라인을 세운다.
              - step:
                  type: Run
                  name: Test
                  identifier: test
                  spec:
                    shell: Sh
                    command: |-
                      pytest tests --ignore=tests/flaky -q \
                        --junitxml=report.xml \
                        --cov=app --cov-report=xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - report.xml

              # flaky 스위트. 리포트에는 남기되 빌드 판정에서는 제외한다.
              - step:
                  type: Run
                  name: Flaky tests
                  identifier: flaky_tests
                  spec:
                    shell: Sh
                    command: |-
                      pytest tests/flaky -q --junitxml=report-flaky.xml || true
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - report-flaky.xml
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore

              # stage 가 끝날 때까지 살아 있는 서비스.
              - step:
                  type: Background
                  name: Run API
                  identifier: run_api
                  spec:
                    shell: Sh
                    command: uvicorn app.main:app --host 127.0.0.1 --port 8000
                    portBindings:
                      "8000": "8000"

              - step:
                  type: Run
                  name: Smoke test
                  identifier: smoke_test
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 30); do
                        curl -sf http://127.0.0.1:8000/health && break
                        sleep 1
                      done
                      curl -sf http://127.0.0.1:8000/health | grep '"status":"ok"'

              # 이미지 빌드만 하고 푸시하지 않는다. 레지스트리 커넥터가 필요 없다.
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build image
                  identifier: build_image
                  spec:
                    connectorRef: <+input>
                    repo: harness-test
                    tags:
                      - <+pipeline.sequenceId>
                    dockerfile: Dockerfile
                    context: .
                    caching: true
                    buildOnly: true
trigger:
  name: on push to main
  identifier: on_push_main
  enabled: true
  description: main 브랜치 push 시 CI 파이프라인 실행
  tags: {}
  orgIdentifier: default
  projectIdentifier: default_project
  pipelineIdentifier: harness_test_ci
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      # Harness Code 레포라 type 은 Harness, connectorRef 는 필요 없다.
      # 외부 GitHub 이면 type: Github 과 connectorRef 를 넣는다.
      type: Harness
      spec:
        type: Push
        spec:
          autoAbortPreviousExecutions: false
          repoName: collabops-web-harness
          actions: []
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
  # 파이프라인의 codebase build 가 <+input> 이므로 트리거가 채워준다.
  inputYaml: |
    pipeline:
      identifier: harness_test_ci
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: <+trigger.branch>
