pipeline:
  name: harness-test CI
  identifier: harness_test_ci
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}

  properties:
    ci:
      codebase:
        # Harness Code Repository 를 쓰면 connectorRef 가 필요 없다.
        # 외부 GitHub 을 쓰면 connectorRef: <커넥터 ID> 를 추가한다.
        repoName: collabops-web-harness
        # 트리거가 Input Set 을 통해 브랜치를 채운다.
        build: <+input>

  stages:
    - stage:
        name: build
        identifier: build
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            # Apple Silicon 에서 도는 Docker 델리게이트라 Arm64.
            arch: Arm64
          runtime:
            # Harness Cloud 는 신용카드 등록이 필요해 로컬 Docker 델리게이트를 쓴다.
            type: Docker
            spec: {}

          execution:
            steps:
              - step:
                  type: Run
                  name: Install dependencies
                  identifier: install
                  spec:
                    shell: Sh
                    command: |-
                      # 로컬 러너는 맥 호스트에서 직접 돈다. 시스템 파이썬을
                      # 건드리지 않도록 워크스페이스에 venv 를 만든다.
                      python3 -m venv .venv
                      .venv/bin/pip install --upgrade pip
                      .venv/bin/pip install -r requirements-dev.txt

              - step:
                  type: Run
                  name: Lint
                  identifier: lint
                  spec:
                    shell: Sh
                    command: .venv/bin/ruff check .

              # 정상 스위트. 실패하면 파이프라인을 세운다.
              - step:
                  type: Run
                  name: Test
                  identifier: test
                  spec:
                    shell: Sh
                    command: |-
                      .venv/bin/pytest tests --ignore=tests/flaky -q \
                        --junitxml=report.xml \
                        --cov=app --cov-report=xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - report.xml

              # flaky 스위트. 리포트에는 남기되 빌드 판정에서는 제외한다.
              - step:
                  type: Run
                  name: Flaky tests
                  identifier: flaky_tests
                  spec:
                    shell: Sh
                    command: |-
                      pytest tests/flaky -q --junitxml=report-flaky.xml || true
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - report-flaky.xml
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore

              # stage 가 끝날 때까지 살아 있는 서비스.
              - step:
                  type: Background
                  name: Run API
                  identifier: run_api
                  spec:
                    shell: Sh
                    command: .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
                    portBindings:
                      "8000": "8000"

              - step:
                  type: Run
                  name: Smoke test
                  identifier: smoke_test
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 30); do
                        curl -sf http://127.0.0.1:8000/health && break
                        sleep 1
                      done
                      curl -sf http://127.0.0.1:8000/health | grep '"status":"ok"'

              # 이미지 빌드만 하고 푸시하지 않는다. 레지스트리 커넥터가 필요 없다.
              # BuildAndPushDockerRegistry 는 레지스트리 커넥터를 요구한다.
              # 로컬 러너는 호스트 Docker 를 그대로 쓸 수 있으므로 Run 으로 빌드만 한다.
              - step:
                  type: Run
                  name: Build image
                  identifier: build_image
                  spec:
                    shell: Sh
                    command: |-
                      if ! command -v docker >/dev/null 2>&1; then
                        for d in /usr/local/bin /opt/homebrew/bin; do
                          [ -x "$d/docker" ] && PATH="$d:$PATH" && export PATH && break
                        done
                      fi
                      command -v docker >/dev/null 2>&1 || {
                        echo "docker 를 찾을 수 없습니다."; exit 1; }
                      docker build -t harness-test:<+pipeline.sequenceId> .
                      docker image ls harness-test --format '{{.Repository}}:{{.Tag}} {{.Size}}'
